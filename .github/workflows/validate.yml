name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint Python scripts
        run: ruff check scripts/

      - name: Install Chromium for browser tests
        run: python -m playwright install --with-deps chromium

      - name: Frontend module tests
        run: node --test tests/frontend/*.test.mjs

      - name: Agent tests
        run: python -m pytest tests/agents -q

      - name: Full test suite
        run: python -m pytest -q --cov=scripts --cov-report=term --cov-fail-under=15

      - name: Validate data
        run: python scripts/validate_data.py

      - name: Check book coverage
        run: python scripts/check_book_coverage.py

      - name: Check published data synchronization
        run: python scripts/check_published_data_sync.py

      - name: Check frontend syntax
        run: |
          for file in docs/assets/*.js docs/assets/*.mjs; do
            node --check "$file" || exit 1
          done
