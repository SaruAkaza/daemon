<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daemon Pilotos</title>
    <link rel="stylesheet" href="assets/styles.css?v=20260605-responsive">
  </head>
  <body>
    <header class="topbar">
      <button class="brand brand-home" id="brandHomeButton" type="button" aria-label="Ir para a página inicial">
        <span>DAEMON/TREVAS</span>
      </button>
      <div class="toolbar top-toolbar">
        <label class="category-select">
          <span>Categorias</span>
          <select id="areaFilter"></select>
        </label>
        <label class="search">
          <span>Busca</span>
          <input id="searchInput" type="search" placeholder="Nome, categoria ou trecho">
        </label>
        <button class="filter-open theme-toggle" id="themeToggle" type="button" aria-pressed="false">Tema escuro</button>
        <button class="icon-button" id="refreshButton" type="button" title="Recarregar" aria-label="Recarregar">↻</button>
        <button class="filter-open" id="filterOpenButton" type="button" hidden>Filtros</button>
        <select id="flagFilter" hidden>
          <option value="all">Todos</option>
          <option value="intro">Introdução</option>
          <option value="ficha">Ficha</option>
          <option value="historia">História</option>
          <option value="personalidade">Personalidade</option>
          <option value="poderes_npc">Poderes</option>
          <option value="curiosidades">Curiosidades</option>
        </select>
      </div>
    </header>

    <main class="shell">
      <section class="workbench">
        <section class="category-hub" id="categoryHub" aria-label="Categorias disponíveis"></section>
        <div class="browser">
          <section class="segments-panel">
            <div class="panel-head">
              <h2 id="segmentsTitle">Itens</h2>
              <div class="panel-actions">
                <span id="segmentsCount"></span>
                <button class="filter-open compact" id="categoryFilterButton" type="button" hidden>Filtros</button>
              </div>
            </div>
            <div class="segments-list" id="segmentsList" role="listbox" aria-label="Itens da categoria"></div>
          </section>

          <article class="detail-panel" id="detailPanel">
            <div class="empty">Selecione um item.</div>
          </article>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>Fontes piloto em revisão</span>
      <span>Dados em revisão</span>
    </footer>

    <div class="filter-backdrop" id="filterBackdrop" hidden>
      <section class="filter-panel" id="filterPanel" role="dialog" aria-modal="true" aria-labelledby="filterTitle">
        <header class="filter-head">
          <div>
            <span class="eyebrow">Refinamento</span>
            <h2 id="filterTitle">Filtros</h2>
          </div>
          <button class="icon-button" id="filterCloseButton" type="button" title="Fechar" aria-label="Fechar">×</button>
        </header>
        <div class="filter-tools">
          <label class="search">
            <span>Filtrar opções</span>
            <input id="filterSearchInput" type="search" placeholder="Livro, categoria ou tipo">
          </label>
          <div class="filter-actions">
            <button id="filterShowAllButton" type="button">Mostrar todos</button>
            <button id="filterClearButton" type="button">Limpar</button>
            <button id="filterDefaultButton" type="button">Padrão</button>
          </div>
        </div>
        <div class="filter-summary" id="filterSummary"></div>
        <div class="filter-groups" id="filterGroups"></div>
        <footer class="filter-foot">
          <button id="filterCancelButton" type="button">Cancelar</button>
          <button class="primary-button" id="filterApplyButton" type="button">Aplicar filtros</button>
        </footer>
      </section>
    </div>

    <template id="categoryCardTemplate">
      <button class="category-card" type="button">
        <span class="category-card-title"></span>
        <span class="category-card-meta"></span>
      </button>
    </template>

    <template id="segmentTemplate">
      <button class="segment-row" type="button" role="option">
        <span class="segment-main">
          <span class="segment-title"></span>
          <span class="segment-preview"></span>
        </span>
        <span class="segment-meta"></span>
      </button>
    </template>

    <template id="filterGroupTemplate">
      <section class="filter-group">
        <div class="filter-group-head">
          <h3></h3>
          <div class="mini-actions">
            <button data-action="all" type="button">Todos</button>
            <button data-action="clear" type="button">Limpar</button>
            <button data-action="default" type="button">Padrão</button>
            <button data-action="mode" type="button">OR</button>
          </div>
        </div>
        <div class="filter-chip-list"></div>
      </section>
    </template>

    <script src="assets/app.js?v=20260607-hash-routes" type="module"></script>
  </body>
</html>
